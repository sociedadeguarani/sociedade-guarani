<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#003D2B">
  <title>Guarani — sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8faf9;color:#17382c;font-family:Arial,sans-serif}
    main{width:min(100%,420px);padding:32px;border:1px solid #dfe7e2;border-radius:24px;background:#fff;text-align:center;box-shadow:0 12px 36px #003d2b12}
    h1{margin:16px 0 8px;color:#003d2b;font-size:24px}p{color:#64748b;line-height:1.6}button{margin-top:14px;padding:13px 22px;border:0;border-radius:12px;background:#005a3c;color:#fff;font-weight:700}
    .mark{display:grid;width:76px;height:76px;place-items:center;margin:auto;border-radius:22px;background:#003d2b;color:#fff;font-size:42px;font-weight:900}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">G</div>
    <h1>Sem conexão</h1>
    <p>Não foi possível conectar ao Sistema Guarani. Confira sua internet e tente novamente.</p>
    <p>Por segurança, cadastros, carteirinhas e informações financeiras não ficam disponíveis sem conexão.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
