name: Quality and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, lint, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The current committed lockfile is older than package.json and omits
      # some direct dependencies. npm install reconciles it in the CI workspace;
      # commit a locally regenerated package-lock.json as a follow-up cleanup.
      - name: Install dependencies
        id: install_dependencies
        run: npm install --no-audit --no-fund

      # npm resolves a fresh lockfile after version and override changes.
      # Upload it so it can be committed back to the repository even if a
      # later validation (e.g. audit) fails.
      - name: Upload regenerated package lock
        if: steps.install_dependencies.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: guarani-regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Business logic and security regression tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
